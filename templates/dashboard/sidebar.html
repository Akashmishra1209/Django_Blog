<!-- Sidebar -->
<div class="col-md-3">

    <!-- User -->
    <div class="bg-light rounded shadow-sm p-3 mb-3 text-center">

        <div class="bg-warning text-dark rounded-circle
                    d-flex align-items-center justify-content-center mx-auto mb-2"
             style="width: 45px; height: 45px; font-weight: 600;">
            {{ user.username|first|upper }}
        </div>

        <div class="font-weight-bold text-dark mb-3">
            {{ user.first_name }} {{ user.last_name }}
        </div>

        <a href="{% url 'logout' %}"
           class="btn btn-sm btn-outline-danger rounded-pill w-100 mb-2">
            Logout
        </a>
    </div>


    <!-- Sidebar Menu -->
    <div class="nav flex-column nav-pills bg-light rounded shadow-sm p-2">

        <a href="{% url 'dashboard' %}"
           class="nav-link text-dark {% if request.path == '/dashboard/' %}bg-warning{% endif %}">
            Dashboard
        </a>

        <a href="{% url 'categories' %}"
           class="nav-link text-dark {% if '/dashboard/categories/' in request.path   %}bg-warning{% endif %}">
            Categories
        </a>

        <a href="{% url 'posts' %}"
           class="nav-link text-dark {% if '/dashboard/posts/' in  request.path  %}bg-warning{% endif %}">
            Posts
        </a>

    </div>

</div>
