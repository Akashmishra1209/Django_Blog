{% extends 'base.html' %}
{% block content %}
    {% load crispy_forms_tags %}
<div class="row">
    <!-- Left Sidebar -->
    {% include 'dashboard/sidebar.html' %}
    <!-- Right Sidebar -->
    <div class="col-md-9">
        <div class="row d-flex flex-column" style="width:500px;">
            <h2>Add New Category</h2>
            <form action="{% url 'add_category' %}" method="POST">
{% csrf_token %}
{{ form|crispy }}
                <button type="submit" class="btn btn-warning">Add Category</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
