{% extends 'base.html' %}
{% block content %}
    {% load crispy_forms_tags %}
    <div class="row">
        <!-- Left Sidebar -->
        {% include 'dashboard/sidebar.html' %}
        <!-- Right Sidebar -->
        <div class="col-md-9">
            <div class="row d-flex flex-column" style="width:500px;">
                <h2>Edit Post</h2>
                <form action="{% url 'edit_post' post.id %}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-warning">Submit</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
