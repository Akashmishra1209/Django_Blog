{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blogs{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">

    <style>
        /* Fallbacks in case blog.css is missing these */
        .blog-header-logo {
            font-family: "Playfair Display", Georgia, "Times New Roman", serif;
            font-size: 2.25rem;
            text-decoration: none;
        }
        .blog-header-logo:hover { text-decoration: none; }

        .nav-scroller {
            position: relative;
            z-index: 2;
            height: 2.75rem;
            overflow-y: hidden;
        }
        .nav-scroller .nav {
            display: flex;
            flex-wrap: nowrap;
            padding-bottom: 1rem;
            margin-top: -1px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .nav-scroller .nav-link,
        .nav-scroller .nav > a { flex-shrink: 0; }
    </style>
</head>
<body>
<div class="container">
    <header class="blog-header py-3 border-bottom">
        <div class="row align-items-center">

            <!-- Logo -->
            <div class="col-12 col-md-4 text-center text-md-left mb-2 mb-md-0">
                <a class="blog-header-logo text-dark" href="/">{{ about.site_name }}</a>
            </div>

            <!-- Search Widget -->
            <div class="col-12 col-md-4 mb-2 mb-md-0">
                <form action="{% url 'search' %}" method="GET">
                    <div class="input-group">
                        <input class="form-control" type="text" name="keyword" value="{{ keyword }}"
                               placeholder="Enter search term..." aria-label="Search" required>
                        <div class="input-group-append">
                            <button type="submit" class="btn btn-warning">Go!</button>
                        </div>
                    </div>
                </form>
            </div>
            <!-- End Search Widget -->

            <!-- Auth buttons -->
            <div class="col-12 col-md-4 d-flex justify-content-center justify-content-md-end">
                <a class="btn btn-warning" href="#">Login</a>
                <a class="btn btn-outline-secondary ml-2" href="#">Register</a>
            </div>

        </div>
    </header>

    <div class="nav-scroller py-1 mb-4 border-bottom">
        <nav class="nav d-flex justify-content-between">
            {% for category in categories %}
                <a class="p-2 text-muted" href="/category/{{ category.id }}">{{ category }}</a>
            {% endfor %}
        </nav>
    </div>

    <main role="main">
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
